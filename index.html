<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S.W.E.T. Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   S.W.E.T. tournament overlay — full schedule + standings computed from it.
   CONFIG lives in the <script> block at the bottom of this file.
   Everything here is presentation only.
   ============================================================ */

:root{
  --paper:      #FFFFFF;   /* panel base                       */
  --paper-2:    #F4F4F7;   /* row wash / inset cards           */
  --ink:        #14131A;   /* primary type, matches banner     */
  --muted:      #86858F;   /* labels, unplayed, secondary      */
  --hair:       rgba(20,19,26,.11);
  --hair-soft:  rgba(20,19,26,.06);

  --val:        #FF4655;   /* Valorant — red, as in the banner */
  --tft:        #B8873B;   /* TFT      — bronze                */
  --lol:        #2A6CC4;   /* League   — cobalt                */

  --s: 1;                  /* set by JS to fit the browser source */
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  width:100%; height:100%;
  background:transparent;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

#stage{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%) scale(var(--s));
  transform-origin:center center;
}

.board{
  width:1240px;
  background:var(--paper);
  border:1px solid var(--hair);
  border-radius:10px;
  overflow:hidden;
  font-family:'Archivo', system-ui, sans-serif;
  color:var(--ink);
  box-shadow:0 26px 70px rgba(20,19,26,.28), 0 2px 8px rgba(20,19,26,.10);
}
.board.bare{ background:none; border:none; box-shadow:none; }

/* ---------- banner masthead ---------- */
.banner{
  position:relative;
  display:flex; align-items:center;
  min-height:152px;
  background:#fff;
  border-bottom:1px solid var(--hair);
  /* right padding reserves the corner the artwork occupies */
  padding:20px 250px 20px 30px;
  overflow:hidden;
}
.mast{ flex:1; min-width:0; }
/* JS sizes this to fill .mast exactly — see fitTitle() */
.wordmark{
  font-weight:800; text-transform:uppercase;
  line-height:.94; letter-spacing:.004em;
  white-space:nowrap;
  font-size:46px;   /* placeholder until fitTitle() runs */
}
/* each word's initial, sized in em so it rides along with fitTitle() */
.wordmark .cap{ font-size:1.50em; line-height:1; }
/* the art is drawn already cut off at its right and bottom edges,
   so pinning it to the corner continues that bleed */
.kitty{
  position:absolute; right:0; bottom:0;
  height:152px; width:auto; display:block;
  pointer-events:none;
}
.stage-tag{
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:12px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--muted);
  margin-bottom:9px;
}

.pad{ padding:22px 30px 20px; }

/* ---------- section label ---------- */
.seclabel{
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:12px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--muted);
  display:flex; align-items:center; gap:12px;
}
.seclabel::after{
  content:''; flex:1; height:1px; background:var(--hair-soft);
}

/* ---------- column labels ---------- */
.collabels{
  display:grid;
  grid-template-columns:34px 40px 1fr 104px 104px 104px 84px;
  align-items:end; gap:0 14px;
  padding:11px 0 7px;
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:10.5px; letter-spacing:.20em; text-transform:uppercase;
  color:var(--muted);
}
.collabels .disc{ text-align:center; font-weight:500; }
.collabels .disc.val{ color:var(--val); }
.collabels .disc.tft{ color:var(--tft); }
.collabels .disc.lol{ color:var(--lol); }
.collabels .tot{ text-align:right; }

/* ---------- standings rows ---------- */
#rows{ display:flex; flex-direction:column; }

.row{
  display:grid;
  grid-template-columns:34px 40px 1fr 104px 104px 104px 84px;
  align-items:center; gap:0 14px;
  padding:7px 0 6px;
  border-top:1px solid var(--hair-soft);
  position:relative;
}
.row.leader{
  background:linear-gradient(90deg, rgba(255,70,85,.09), rgba(255,70,85,0) 62%);
}
.row.leader::before{
  content:''; position:absolute; left:-30px; top:-1px; bottom:0;
  width:4px; background:var(--val);
}

.rank{
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:18px; color:#C3C2CB;
}
.row.leader .rank{ color:var(--ink); }

/* team icon — the art is full-body, so fit it whole inside the circle */
.ico{
  width:40px; height:40px; border-radius:50%;
  background:var(--paper-2);
  border:1.5px solid var(--hair);
  object-fit:contain; padding:2px;
  display:block; flex:none;
}
.row.leader .ico{ border-color:rgba(255,70,85,.45); }

.team{ min-width:0; }
.name{
  font-size:21px; font-weight:800; letter-spacing:.01em;
  text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.name.nocase, .mname.nocase{ text-transform:none; }

/* ---------- pip strip: 3 games per discipline ---------- */
.pips{ display:flex; justify-content:center; gap:8px; }
.pip{
  width:11px; height:11px; border-radius:50%;
  border:2px solid currentColor;
}
.pip.win{ background:currentColor; }
.pip.loss{ background:transparent; opacity:.30; }
.pip.tbd{
  border-color:rgba(20,19,26,.14);
  background:transparent;
}
.pips.val{ color:var(--val); }
.pips.tft{ color:var(--tft); }
.pips.lol{ color:var(--lol); }

.total{
  text-align:right;
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:21px; font-weight:500;
}
.total .l{ color:#BCBBC4; }

/* ---------- schedule: every match, one column per title ---------- */
.schedwrap{ margin-top:16px; }
.schedule{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:13px;
  margin-top:10px;
}
.gcol{ min-width:0; display:flex; flex-direction:column; gap:6px; }
.ghead{
  align-self:flex-start;
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
  color:#fff; padding:3px 9px; border-radius:3px; margin-bottom:1px;
}
.ghead.val{ background:var(--val); }
.ghead.tft{ background:var(--tft); }
.ghead.lol{ background:var(--lol); }

.mcard{
  background:var(--paper-2);
  border:1px solid var(--hair-soft);
  border-radius:6px;
  padding:6px 9px 7px;
}
/* the slot that's on deck */
.mcard.up{
  background:#fff;
  border-color:rgba(255,70,85,.45);
  box-shadow:0 0 0 2px rgba(255,70,85,.10);
}

.mtop{
  display:flex; align-items:center; gap:6px; margin-bottom:4px;
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:#B7B6C0;
}
.mtop .mslot{ color:var(--muted); }
.mtop .sp{ flex:1; }
.mflag{ display:flex; align-items:center; gap:5px; color:var(--val); }
.dot{
  width:6px; height:6px; border-radius:50%; background:var(--val);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{ 50%{ opacity:.25; } }

.mrow{ display:flex; align-items:center; gap:7px; padding:1px 0; }
.mico{
  width:21px; height:21px; border-radius:50%; flex:none;
  object-fit:contain; padding:1px;
  background:#fff; border:1px solid var(--hair);
}
.mname{
  font-size:13px; font-weight:700; letter-spacing:.01em; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;
}
.mside{
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:9px; letter-spacing:.10em; color:var(--muted);
  border:1px solid var(--hair); border-radius:3px; padding:0 4px; flex:none;
}
.mres{
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:9.5px; letter-spacing:.10em; flex:none;
}
.mrow.win .mres{ color:var(--val); }
.mrow.win .mname{ font-weight:800; }
.mrow.lose{ opacity:.40; }
.mrow.lose .mres{ color:var(--muted); }

/* ---------- footer ---------- */
.footer{
  display:flex; justify-content:space-between; align-items:center;
  margin-top:18px; padding-top:12px; border-top:1px solid var(--hair);
  font-family:'DM Mono', ui-monospace, monospace;
  font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted);
}
.status.warn{ color:var(--tft); }

/* ---------- motion ---------- */
.row{ transition:transform .5s cubic-bezier(.2,.8,.2,1); }
@keyframes flash{
  0%{ background-color:rgba(255,70,85,.20); }
  100%{ background-color:rgba(255,70,85,0); }
}
.row.changed{ animation:flash 1.2s ease-out; }
.row.enter{ animation:rise .5s ease-out backwards; }
@keyframes rise{ from{ opacity:0; transform:translateY(10px); } }

@media (prefers-reduced-motion:reduce){
  .row, .row.changed, .row.enter, .dot{ animation:none; transition:none; }
}

/* ---------- view modes ---------- */
body.view-standings .schedwrap{ display:none; }
body.view-schedule  .standwrap{ display:none; }
</style>
</head>

function iconHTML(t, cls){

}

/* Which discipline column a Game cell belongs to, and what the two sides are
   called. Both are derived from the Game name, so adding a row for a title
   needs no code change. */
function gameKeyFor(label){
  const g = String(label).toLowerCase();
  if (g.includes('valorant'))                    return 'val';
  if (g.includes('tft') || g.includes('teamfight')) return 'tft';
  if (g.includes('league') || g.includes('lol')) return 'lol';
  return 'other';
}
function sidesFor(gk){
  if (gk === 'val') return ['ATK', 'DEF'];
  if (gk === 'lol') return ['BLUE', 'RED'];
  return [null, null];          // TFT lobbies have no sides
}

/* Accepts '13:00' or '1:00 PM'; returns minutes past midnight, or null. */
function clockMins(raw){
  const m = String(raw).match(/(\d{1,2}):(\d{2})\s*([AaPp])?/);
  if (!m) return null;
  let h = +m[1];
  const min = +m[2], mer = m[3] && m[3].toLowerCase();
  if (mer === 'p' && h < 12) h += 12;
  if (mer === 'a' && h === 12) h = 0;
  return h * 60 + min;
}

/* enlarge the first letter of every word — split keeps the spaces as pieces */
function titleHTML(text){

    /^\s*$/.test(part)
      ? esc(part)
      : '<span class="cap">' + esc(part.slice(0, 1)) + '</span>' + esc(part.slice(1))
  ).join('');
}

/* ---------- size the masthead so the title spans the full width ---------- */
const TITLE_MAX = 72;
function fitTitle(){
  const el = $('#wordmark');
  const avail = el.parentElement.clientWidth;
  if (!avail) return;
  el.style.fontSize = '100px';
  const w = el.scrollWidth;
  if (!w) return;
  el.style.fontSize = Math.min(100 * avail / w, TITLE_MAX).toFixed(2) + 'px';
}

/* ---------- scale the board to fill whatever size the source is ---------- */
function fit(){
  const pad = 8;
  const board = $('#board');
  const vw = window.innerWidth, vh = window.innerHeight;

  /* OBS reports a 0x0 window while a source is being created or a scene
     reactivates. Scaling against that yields a negative --s and the board
     disappears until the next refresh, so sit tight and keep the last size. */
  if (vw < 40 || vh < 40) return;

  fitTitle();
  const w = (vw - pad) / DESIGN_W;
  const h = (vh - pad) / Math.max(board.offsetHeight, 1);
  document.documentElement.style.setProperty(
    '--s', Math.max(0.05, Math.min(w, h, 2)).toFixed(4));
}
window.addEventListener('resize', fit);

/* the measurement is only right once Archivo has actually loaded */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

/* ---------- pull a tab via gviz JSONP (no CORS headaches) ---------- */
function gviz(sheetName){
  return new Promise((resolve, reject) => {
    const cb  = 'gviz_cb_' + Math.random().toString(36).slice(2, 10);
    const url = 'https://docs.google.com/spreadsheets/d/' + CONFIG.id +
                '/gviz/tq?tqx=out:json;responseHandler:' + cb +
                '&sheet=' + encodeURIComponent(sheetName) +
                '&headers=1&_=' + Date.now();

    const tag = document.createElement('script');
    let done = false;
    const cleanup = () => { done = true; clearTimeout(timer); delete window[cb]; tag.remove(); };
    const timer = setTimeout(() => { if (!done){ cleanup(); reject(new Error('timeout')); } }, 8000);

    window[cb] = res => {
      cleanup();
      if (!res || res.status === 'error' || !res.table) reject(new Error('no such tab'));
      else resolve(res);
    };
    tag.onerror = () => { if (!done){ cleanup(); reject(new Error('network')); } };
    tag.src = url;
    document.head.appendChild(tag);
  });
}

/* column lookup helpers shared by both parsers */
function indexer(res){
  const cols = res.table.cols.map(c => (c.label || '').trim().toLowerCase());
  return (...needles) => cols.findIndex(c => needles.some(n => c.includes(n)));
}
function cellOf(r, i){
  if (i < 0 || !r.c || !r.c[i]) return '';
  const c = r.c[i];
  return (c.f != null ? c.f : (c.v != null ? c.v : '')).toString().trim();
}

/* ---------- standings, derived entirely from the match winners ---------- */
function computeStandings(state){
  const acc = {};
  for (const k of Object.keys(TEAMS)){
    /* w/l track the overall record so a title we don't have a column for
       still counts toward the total */
    acc[k] = { val:{w:0,l:0}, tft:{w:0,l:0}, lol:{w:0,l:0}, w:0, l:0 };
  }

  /* every decided match is one win for someone and one loss for the other */
  const h2h = {};                       // 'winner|loser' -> how many times
  state.slots.forEach(s => s.matches.forEach(m => {
    const won = state.results[s.slot + '|' + m.letter];
    if (!won) return;
    const a = key(m.a), b = key(m.b);
    if (won !== a && won !== b) return; // a name that matches neither side
    const lost = won === a ? b : a;
    if (!acc[won] || !acc[lost]) return;
    if (acc[won][s.gk]){ acc[won][s.gk].w++; acc[lost][s.gk].l++; }
    acc[won].w++;
    acc[lost].l++;
    h2h[won + '|' + lost] = (h2h[won + '|' + lost] || 0) + 1;
  }));

  const teams = Object.keys(TEAMS).map(k => {
    const t = TEAMS[k], a = acc[k];
    return {
      key:k, name:t.name, icon:t.icon, keepCase:!!t.keepCase,
      val:a.val, tft:a.tft, lol:a.lol, w:a.w, l:a.l
    };
  });

  /* the doc's order: total wins, then head-to-head between the tied teams.
     Its deeper tiebreakers (round differential, TFT points, win times) need
     numbers the sheet doesn't carry, so ties past this fall back to name. */
  const head = (x, y) => (h2h[x + '|' + y] || 0) - (h2h[y + '|' + x] || 0);
  if (CONFIG.sort){
    teams.sort((a, b) =>
      (b.w - a.w) || head(b.key, a.key) || (a.l - b.l) || a.name.localeCompare(b.name));
  }
  return teams;
}

/* ---------- the Schedule tab IS the schedule ----------
   Slot | Match | Time | Game | Team 1 | Team 2 | Winner
   Everything on screen comes from here: pairings, times, order and results. */
function parseSchedule(res){
  const find = indexer(res);

  /* a CSV pasted into a single cell still "matches" every header we look for,
     which would silently parse to nonsense — catch that before it does */
  if (res.table.cols.length < 3) throw new Error('not split into columns');

  const iSlot = find('slot'), iMatch = find('match'), iTime = find('time');
  const iGame = find('game', 'title'), iWin = find('winner', 'result', 'won');
  const iA = find('team 1', 'team1', 'home'), iB = find('team 2', 'team2', 'away');

  if (iSlot < 0 || iWin < 0) throw new Error('needs Slot and Winner columns');
  if (iSlot === iWin)        throw new Error('not split into columns');
  if (iA < 0 || iB < 0)      throw new Error('needs Team 1 and Team 2 columns');

  const slots = [], bySlot = {}, results = {};

  res.table.rows.forEach(r => {
    const slot = parseInt(cellOf(r, iSlot), 10);
    const a = cellOf(r, iA), b = cellOf(r, iB);
    if (!slot || (!a && !b)) return;

    const game = cellOf(r, iGame) || '';
    const gk   = gameKeyFor(game);

    if (!bySlot[slot]){
      const t = cellOf(r, iTime);
      bySlot[slot] = {
        slot, game, gk,
        time: t, start: clockMins(t), end: null,
        matches: []
      };
      slots.push(bySlot[slot]);   // sheet row order decides slot order
    }

    const sides = sidesFor(gk);
    /* takes the trailing letter, so 'A' and 'Match A' both read as A;
       blank falls back to this row's position within the slot */
    const tag = (cellOf(r, iMatch) || '').toUpperCase().match(/([A-Z])\s*$/);
    const letter = tag ? tag[1] : ('AB'[bySlot[slot].matches.length] || 'A');

    bySlot[slot].matches.push({ a, b, as:sides[0], bs:sides[1], letter });

    const w = cellOf(r, iWin);
    if (w) results[slot + '|' + letter] = key(w);
  });

  if (!slots.length) throw new Error('no match rows found');

  /* a slot runs until the next one starts; the last gets an hour */
  slots.forEach((s, i) => {
    const next = slots[i + 1];
    s.end = (next && next.start != null) ? next.start
          : (s.start != null ? s.start + 60 : null);
  });

  return { slots, results };
}

/* ---------- which slot is live ---------- */
function ptMinutes(){
  const s = new Date().toLocaleTimeString('en-GB', { timeZone:'America/Los_Angeles', hour12:false });
  const [h, m] = s.split(':').map(Number);
  return h * 60 + m;
}
function currentIndex(state){
  const slots = state.slots;
  if (CONFIG.slot) return Math.min(Math.max(CONFIG.slot, 1), slots.length) - 1;

  /* the first slot whose matches aren't all decided */
  const anyResult = Object.keys(state.results).length > 0;
  if (anyResult){
    for (let i = 0; i < slots.length; i++){
      const done = slots[i].matches.every(m => state.results[slots[i].slot + '|' + m.letter]);
      if (!done) return i;
    }
    return slots.length;   /* everything played */
  }

  /* nothing played yet — fall back to the clock */
  const now = ptMinutes();
  for (let i = 0; i < slots.length; i++){
    if (slots[i].end != null && now < slots[i].end) return i;
  }
  return 0;
}
function isLive(state, i){
  const s = state.slots[i];
  if (!s) return false;
  if (CONFIG.slot) return true;
  if (s.start == null || s.end == null) return false;
  const now = ptMinutes();
  return now >= s.start && now < s.end;
}

/* ---------- draw: standings ---------- */
const GAMES_PER_DISC = 3;

function pipStrip(rec, cls){
  let html = '<div class="pips ' + cls + '">';
  for (let i = 0; i < GAMES_PER_DISC; i++){
    const k = i < rec.w ? 'win' : (i < rec.w + rec.l ? 'loss' : 'tbd');
    html += '<span class="pip ' + k + '"></span>';
  }
  return html + '</div>';
}
function signature(t){
  return [t.name, t.val.w, t.val.l, t.tft.w, t.tft.l, t.lol.w, t.lol.l].join('|');
}

let lastGood = null;

function renderStandings(teams){
  const prev = lastGood ? new Map(lastGood.map(t => [t.name, signature(t)])) : null;
  const host = $('#rows');
  host.innerHTML = '';

  const topWins = teams.length ? teams[0].w : 0;

  teams.forEach((t, idx) => {
    const row = document.createElement('div');
    row.className = 'row';
    if (CONFIG.sort && t.w === topWins && t.w > 0) row.classList.add('leader');

    row.innerHTML =
      '<div class="rank">' + String(idx + 1).padStart(2, '0') + '</div>' +
      iconHTML(t, 'ico') +
      '<div class="team">' +
        '<div class="name' + (t.keepCase ? ' nocase' : '') + '">' + esc(t.name) + '</div>' +
      '</div>' +
      pipStrip(t.val, 'val') +
      pipStrip(t.tft, 'tft') +
      pipStrip(t.lol, 'lol') +
      '<div class="total">' + t.w + '<span class="l">–' + t.l + '</span></div>';

    if (!prev) { row.classList.add('enter'); row.style.animationDelay = (idx * 70) + 'ms'; }
    else if (prev.get(t.name) !== signature(t)) row.classList.add('changed');

    host.appendChild(row);
  });

  lastGood = teams;
}

/* ---------- draw: the full schedule, one column per title ---------- */
function fmtTime(hhmm){
  let [h, m] = hhmm.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + String(m).padStart(2, '0') + ' ' + ap;
}

function matchCardHTML(s, m, results, isUp, live){
  const winner = results[s.slot + '|' + m.letter] || null;

  /* one team's line: icon, name, then either its side tag or the result */
  function line(rawName, side){
    const t   = team(rawName);
    const won = winner && key(rawName) === winner;
    const trail = winner
      ? '<span class="mres">' + (won ? 'WIN' : 'LOSS') + '</span>'
      : (side ? '<span class="mside">' + esc(side) + '</span>' : '');

    return '<div class="mrow' + (winner ? (won ? ' win' : ' lose') : '') + '">' +
      iconHTML(t, 'mico') +
      '<span class="mname' + (t.keepCase ? ' nocase' : '') + '">' + esc(t.name) + '</span>' +
      trail +
    '</div>';
  }

  return '<div class="mcard' + (isUp ? ' up' : '') + '">' +
    '<div class="mtop">' +
      '<span class="mslot">Slot ' + esc(s.slot) + ' · ' + esc(m.letter) + '</span>' +
      '<span>' + esc(s.time || '') + '</span>' +
      '<span class="sp"></span>' +
      (isUp
        ? '<span class="mflag">' + (live ? '<span class="dot"></span>Live' : 'Up next') + '</span>'
        : '') +
    '</div>' +
    line(m.a, m.as) +
    line(m.b, m.bs) +
  '</div>';
}

function renderSchedule(state){
  const cur    = currentIndex(state);
  const live   = isLive(state, cur);
  const upSlot = state.slots[cur] ? state.slots[cur].slot : null;

  /* one column per game title, in the order the titles first appear */
  const cols = [];
  state.slots.forEach(s => {
    let c = cols.find(x => x.gk === s.gk && x.label === s.game);
    if (!c) cols.push(c = { gk:s.gk, label:s.game, slots:[] });
    c.slots.push(s);
  });

  $('#schedule').style.gridTemplateColumns = 'repeat(' + Math.max(cols.length, 1) + ', 1fr)';
  $('#schedule').innerHTML = cols.map(c =>
    '<div class="gcol">' +
      '<div class="ghead ' + c.gk + '">' + esc(c.label) + '</div>' +
      c.slots.map(s =>
        s.matches.map(m =>
          matchCardHTML(s, m, state.results, s.slot === upSlot, live)
        ).join('')
      ).join('') +
    '</div>'
  ).join('');
}

/* ---------- refresh cycle ---------- */
/* the Schedule tab is the only input: pairings, times, order AND results */
let state = { slots: FALLBACK_SCHEDULE, results: {} };
let haveSheet = false;

async function load(){
  let fresh = null, err = null;
  try { fresh = parseSchedule(await gviz(CONFIG.schedule)); }
  catch (e) { err = e.message; console.info('Schedule tab unreadable:', e.message); }

  /* on a blip keep the last good data on screen rather than blanking */
  if (fresh){ state = fresh; haveSheet = true; }

  renderStandings(computeStandings(state));
  renderSchedule(state);

  if (!err) setStatus('Live', false);
  else setStatus(haveSheet ? 'Reconnecting — showing last good data'
                           : 'Cannot read Schedule tab: ' + err, true);

  $('#updated').textContent = 'Updated ' +
    new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  fit();
}

function setStatus(msg, warn){
  const el = $('#status');
  el.textContent = msg;
  el.classList.toggle('warn', !!warn);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- go ---------- */
renderSchedule(state);
load();
setInterval(load, CONFIG.poll);
fit();
</script>
